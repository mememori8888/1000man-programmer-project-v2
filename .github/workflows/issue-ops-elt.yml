name: IssueOps ELT

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  parse:
    runs-on: ubuntu-latest
    if: |
      (
        contains(github.event.issue.body, '/run-facility') ||
        contains(github.event.issue.body, '/run-reviews')
      ) &&
      (
        github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/承認'))
      )
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      workflow_type: ${{ steps.parse.outputs.workflow_type }}
      dataset_kind: ${{ steps.parse.outputs.dataset_kind }}
      payload_json: ${{ steps.parse.outputs.payload_json }}
      valid: ${{ steps.parse.outputs.valid }}
      validation_errors: ${{ steps.parse.outputs.validation_errors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate approval
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "should_run=preview" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$COMMENT_BODY" == *"/承認"* ]] && { [ "$COMMENT_USER" = "mememori8888" ] || [ "$COMMENT_AUTHOR_ASSOC" = "OWNER" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.should_run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        if: steps.gate.outputs.should_run != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Parse issue body
        id: parse
        if: steps.gate.outputs.should_run != 'false'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("issue-body.md").write_text(os.environ["ISSUE_BODY"], encoding="utf-8")
          PY
          python -m elt_v2.issue_ops --body-file issue-body.md --github-output "$GITHUB_OUTPUT"

      - name: Comment preview
        if: steps.gate.outputs.should_run == 'preview'
        uses: actions/github-script@v7
        env:
          WORKFLOW_TYPE: ${{ steps.parse.outputs.workflow_type }}
          DATASET_KIND: ${{ steps.parse.outputs.dataset_kind }}
          VALIDATION_ERRORS: ${{ steps.parse.outputs.validation_errors }}
        with:
          script: |
            const valid = '${{ steps.parse.outputs.valid }}' === 'true';
            const errors = process.env.VALIDATION_ERRORS || '';
            const body = valid
              ? [
                  '## v2 ELT job accepted',
                  '',
                  `- workflow: \`${process.env.WORKFLOW_TYPE}\``,
                  `- raw dataset: \`${process.env.DATASET_KIND}\``,
                  '',
                  '管理者が `/承認` とコメントすると BrightData extract と raw ELT 保存を開始します。'
                ].join('\n')
              : [
                  '## v2 ELT job validation failed',
                  '',
                  '```',
                  errors || 'Unknown validation error',
                  '```'
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Comment unauthorized
        if: steps.gate.outputs.should_run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '実行権限がないため `/承認` は処理されませんでした。'
            });

  config:
    needs: parse
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.valid == 'true'
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      ELT_RAW_GCS_BUCKET: ${{ vars.ELT_RAW_GCS_BUCKET }}
      ELT_BIGQUERY_PROJECT_ID: ${{ vars.ELT_BIGQUERY_PROJECT_ID }}
      ELT_BIGQUERY_DATASET: ${{ vars.ELT_BIGQUERY_DATASET }}
    outputs:
      valid: ${{ steps.check.outputs.valid }}
      errors: ${{ steps.check.outputs.errors }}
    steps:
      - name: Check runtime configuration
        id: check
        env:
          WORKFLOW_TYPE: ${{ needs.parse.outputs.workflow_type }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          workflow_type = os.environ["WORKFLOW_TYPE"]
          missing = []
          if workflow_type == "reviews_recent_relevance":
              for name in [
                  "GCP_SERVICE_ACCOUNT_JSON",
                  "ELT_RAW_GCS_BUCKET",
                  "ELT_BIGQUERY_PROJECT_ID",
                  "ELT_BIGQUERY_DATASET",
              ]:
                  if not os.environ.get(name):
                      missing.append(name)

          print(f"valid={'false' if missing else 'true'}")
          if missing:
              print("errors<<EOF")
              print("reviews_recent_relevance requires these settings before paid extraction:")
              for name in missing:
                  print(f"- {name}")
              print("")
              print("Run the v2 ELT preflight workflow after configuring them.")
              print("EOF")
          else:
              print("errors=")
          PY

  extract:
    needs: [parse, config]
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.valid == 'true' && needs.config.outputs.valid == 'true'
    uses: ./.github/workflows/brightdata-extract.yml
    secrets: inherit
    with:
      workflow_type: ${{ needs.parse.outputs.workflow_type }}
      csv_file: ${{ fromJson(needs.parse.outputs.payload_json).params.csv_file || fromJson(needs.parse.outputs.payload_json).params.fid_file || fromJson(needs.parse.outputs.payload_json).params.custom_settings.address_csv_path || 'settings/address.csv' }}
      dataset_id: ${{ fromJson(needs.parse.outputs.payload_json).params.dataset_id || 'gd_luzfs1dn2oa0teb81' }}
      days_back: ${{ fromJson(needs.parse.outputs.payload_json).params.days_back || '10' }}
      skip_column: ${{ fromJson(needs.parse.outputs.payload_json).params.skip_column || '' }}
      query: ${{ fromJson(needs.parse.outputs.payload_json).params.custom_settings.query || '' }}
      start_row: ${{ fromJson(needs.parse.outputs.payload_json).params.start_line || '1' }}
      start_from_batch: ${{ fromJson(needs.parse.outputs.payload_json).params.start_from_batch || '' }}
      rows_per_batch: ${{ fromJson(needs.parse.outputs.payload_json).params.rows_per_batch || '' }}
      max_batches: ${{ fromJson(needs.parse.outputs.payload_json).params.max_batches || '1' }}
      row_limit: ${{ fromJson(needs.parse.outputs.payload_json).params.process_count || '' }}

  serp_relevance:
    needs: [parse, extract]
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.valid == 'true' && needs.parse.outputs.workflow_type == 'reviews_recent_relevance' && needs.extract.result == 'success'
    uses: ./.github/workflows/serp-relevance-batch.yml
    secrets: inherit
    with:
      csv_file: ${{ fromJson(needs.parse.outputs.payload_json).params.csv_file || 'results/dental_new.csv' }}
      target_source: bigquery_recent_reviews
      bigquery_project_id: ${{ vars.ELT_BIGQUERY_PROJECT_ID || '' }}
      bigquery_dataset: ${{ vars.ELT_BIGQUERY_DATASET || '' }}
      days_back: ${{ fromJson(needs.parse.outputs.payload_json).params.days_back || '30' }}
      skip_column: ${{ fromJson(needs.parse.outputs.payload_json).params.skip_column || 'web' }}
      zone: ${{ fromJson(needs.parse.outputs.payload_json).params.serp_zone_name || 'serp_api2' }}
      start_from_batch: ${{ fromJson(needs.parse.outputs.payload_json).params.start_from_batch || '1' }}
      rows_per_batch: ${{ fromJson(needs.parse.outputs.payload_json).params.rows_per_batch || '10' }}
      row_limit: ${{ fromJson(needs.parse.outputs.payload_json).params.rows_per_batch || '10' }}
      serp_max_workers: ${{ fromJson(needs.parse.outputs.payload_json).params.serp_max_workers || '3' }}

  report:
    needs: [parse, config, extract, serp_relevance]
    if: always() && needs.parse.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        uses: actions/github-script@v7
        env:
          EXTRACT_RESULT: ${{ needs.extract.result }}
          SERP_RESULT: ${{ needs.serp_relevance.result }}
          CONFIG_RESULT: ${{ needs.config.result }}
          CONFIG_VALID: ${{ needs.config.outputs.valid }}
          CONFIG_ERRORS: ${{ needs.config.outputs.errors }}
          PARSE_VALID: ${{ needs.parse.outputs.valid }}
          VALIDATION_ERRORS: ${{ needs.parse.outputs.validation_errors }}
        with:
          script: |
            const extractResult = process.env.EXTRACT_RESULT || 'skipped';
            const serpResult = process.env.SERP_RESULT || 'skipped';
            const configResult = process.env.CONFIG_RESULT || 'skipped';
            const configValid = process.env.CONFIG_VALID === 'true';
            const configErrors = process.env.CONFIG_ERRORS || '';
            const valid = process.env.PARSE_VALID === 'true';
            const errors = process.env.VALIDATION_ERRORS || '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const activeResults = [
              ['BrightData extract', extractResult],
              ['SERP relevance', serpResult],
            ].filter(([, result]) => result && result !== 'skipped');
            const hasFailure = activeResults.some(([, result]) => ['failure', 'cancelled', 'timed_out'].includes(result));
            const resultLines = activeResults.length
              ? activeResults.map(([name, result]) => `- ${name}: \`${result}\``)
              : ['- no execution job was started'];

            let body;
            if (!valid) {
              body = [
                '## v2 ELT validation failed',
                '',
                '```',
                errors || 'Unknown validation error',
                '```',
                '',
                `[Actions run](${runUrl})`,
              ].join('\n');
            } else if (!configValid && configResult !== 'skipped') {
              body = [
                '## v2 ELT configuration check failed',
                '',
                '```',
                configErrors || 'Unknown configuration error',
                '```',
                '',
                `[Actions run](${runUrl})`,
              ].join('\n');
            } else if (hasFailure) {
              body = [
                '## v2 ELT execution failed',
                '',
                ...resultLines,
                '',
                'BrightData入力CSV検証、抽出、GCS/BigQuery投入、またはSERP関連度処理のいずれかで停止しました。',
                `[Actions run](${runUrl})`,
              ].join('\n');
            } else {
              body = [
                '## v2 ELT execution completed',
                '',
                ...resultLines,
                '',
                'artifact と workflow summary に raw object、manifest、GCS/BigQuery の結果が保存されています。',
                `[Actions run](${runUrl})`,
              ].join('\n');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
