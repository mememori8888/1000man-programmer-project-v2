name: IssueOps ELT

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  parse:
    runs-on: ubuntu-latest
    if: |
      (
        contains(github.event.issue.body, '/run-facility') ||
        contains(github.event.issue.body, '/run-reviews')
      ) &&
      (
        github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/承認'))
      )
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      workflow_type: ${{ steps.parse.outputs.workflow_type }}
      dataset_kind: ${{ steps.parse.outputs.dataset_kind }}
      payload_json: ${{ steps.parse.outputs.payload_json }}
      valid: ${{ steps.parse.outputs.valid }}
      validation_errors: ${{ steps.parse.outputs.validation_errors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate approval
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "should_run=preview" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$COMMENT_BODY" == *"/承認"* ]] && { [ "$COMMENT_USER" = "mememori8888" ] || [ "$COMMENT_AUTHOR_ASSOC" = "OWNER" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.should_run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        if: steps.gate.outputs.should_run != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Parse issue body
        id: parse
        if: steps.gate.outputs.should_run != 'false'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("issue-body.md").write_text(os.environ["ISSUE_BODY"], encoding="utf-8")
          PY
          python -m elt_v2.issue_ops --body-file issue-body.md --github-output "$GITHUB_OUTPUT"

      - name: Comment preview
        if: steps.gate.outputs.should_run == 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const valid = '${{ steps.parse.outputs.valid }}' === 'true';
            const errors = `${{ steps.parse.outputs.validation_errors }}`;
            const body = valid
              ? [
                  '## v2 ELT job accepted',
                  '',
                  `- workflow: \`${{ steps.parse.outputs.workflow_type }}\``,
                  `- raw dataset: \`${{ steps.parse.outputs.dataset_kind }}\``,
                  '',
                  '管理者が `/承認` とコメントすると raw ELT ingest を開始します。'
                ].join('\n')
              : [
                  '## v2 ELT job validation failed',
                  '',
                  '```',
                  errors || 'Unknown validation error',
                  '```'
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Comment unauthorized
        if: steps.gate.outputs.should_run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '実行権限がないため `/承認` は処理されませんでした。'
            });

  ingest:
    needs: parse
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.valid == 'true' && needs.parse.outputs.workflow_type == 'reviews'
    uses: ./.github/workflows/raw-elt-ingest.yml
    with:
      dataset_kind: ${{ needs.parse.outputs.dataset_kind }}
      payload_json: ${{ needs.parse.outputs.payload_json }}
      source_run_id: issue-${{ github.event.issue.number }}-${{ github.run_id }}
      gcs_bucket: ${{ vars.ELT_RAW_GCS_BUCKET || '' }}
      bigquery_project_id: ${{ vars.ELT_BIGQUERY_PROJECT_ID || '' }}
      bigquery_dataset: ${{ vars.ELT_BIGQUERY_DATASET || '' }}

  extract:
    needs: parse
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.valid == 'true' && needs.parse.outputs.workflow_type != 'reviews'
    uses: ./.github/workflows/brightdata-extract.yml
    secrets: inherit
    with:
      workflow_type: ${{ needs.parse.outputs.workflow_type }}
      csv_file: ${{ fromJson(needs.parse.outputs.payload_json).params.csv_file || fromJson(needs.parse.outputs.payload_json).params.custom_settings.address_csv_path || 'settings/address.csv' }}
      dataset_id: ${{ fromJson(needs.parse.outputs.payload_json).params.dataset_id || 'gd_luzfs1dn2oa0teb81' }}
      days_back: ${{ fromJson(needs.parse.outputs.payload_json).params.days_back || '10' }}
      skip_column: ${{ fromJson(needs.parse.outputs.payload_json).params.skip_column || 'web' }}
      query: ${{ fromJson(needs.parse.outputs.payload_json).params.custom_settings.query || '' }}
      start_from_batch: ${{ fromJson(needs.parse.outputs.payload_json).params.start_from_batch || '1' }}
      rows_per_batch: ${{ fromJson(needs.parse.outputs.payload_json).params.rows_per_batch || '500' }}
      max_batches: ${{ fromJson(needs.parse.outputs.payload_json).params.max_batches || '1' }}
      row_limit: ""

  report:
    needs: [parse, ingest, extract]
    if: always() && needs.parse.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        uses: actions/github-script@v7
        with:
          script: |
            const rawResult = '${{ needs.ingest.result }}';
            const extractResult = '${{ needs.extract.result }}';
            const result = extractResult && extractResult !== 'skipped' ? extractResult : rawResult;
            const valid = '${{ needs.parse.outputs.valid }}' === 'true';
            const errors = `${{ needs.parse.outputs.validation_errors }}`;
            const body = valid
              ? `v2 ELT result: \`${result}\`\n\nBrightData extract または raw ingest の artifact に raw object と manifest が保存されています。`
              : `v2 ELT validation failed:\n\n\`\`\`\n${errors || 'Unknown validation error'}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
