name: Raw ELT ingest

on:
  workflow_dispatch:
    inputs:
      dataset_kind:
        description: Raw dataset kind
        required: true
        type: choice
        options:
          - reviews
          - facilities
          - serp_relevance
      payload_json:
        description: Raw request or BrightData payload JSON
        required: true
      source_run_id:
        description: Source run id
        required: false
        default: manual
      gcs_bucket:
        description: Optional GCS bucket for raw upload
        required: false
        default: ""
      bigquery_project_id:
        description: Optional BigQuery project id
        required: false
        default: ""
      bigquery_dataset:
        description: Optional BigQuery dataset
        required: false
        default: ""
      run_transform:
        description: Run managed BigQuery transform SQL after raw load
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      dataset_kind:
        required: true
        type: string
      payload_json:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      gcs_bucket:
        required: false
        type: string
        default: ""
      bigquery_project_id:
        required: false
        type: string
        default: ""
      bigquery_dataset:
        required: false
        type: string
        default: ""
      run_transform:
        required: false
        type: string
        default: "true"
    secrets:
      GCP_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ inputs.gcs_bucket }}" ] || [ -n "${{ inputs.bigquery_project_id }}" ]; then
            pip install ".[gcp]"
          else
            pip install -e .
          fi

      - name: Authenticate to Google Cloud
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Write payload file
        env:
          PAYLOAD_JSON: ${{ inputs.payload_json }}
        run: |
          mkdir -p work/raw-input
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["PAYLOAD_JSON"])
          Path("work/raw-input/payload.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Store raw object locally
        id: local
        run: |
          elt-raw-write \
            --input work/raw-input/payload.json \
            --source-run-id "${{ inputs.source_run_id }}" \
            --dataset-kind "${{ inputs.dataset_kind }}" \
            --local-output-root work/raw-output | tee work/raw-write-result.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          result = json.loads(Path("work/raw-write-result.json").read_text(encoding="utf-8"))
          manifest = result["manifest"]
          local_path = result["local_path"]
          print(f"object_name={manifest['object_name']}")
          print(f"manifest_path={local_path}.manifest.json")
          print(f"local_path={local_path}")
          PY

      - name: Upload raw object to GCS
        if: inputs.gcs_bucket != ''
        run: |
          elt-raw-write \
            --input work/raw-input/payload.json \
            --source-run-id "${{ inputs.source_run_id }}" \
            --dataset-kind "${{ inputs.dataset_kind }}" \
            --gcs-bucket "${{ inputs.gcs_bucket }}"

      - name: Load raw row into BigQuery
        if: inputs.gcs_bucket != '' && inputs.bigquery_project_id != '' && inputs.bigquery_dataset != ''
        run: |
          elt-bigquery run-sql \
            --sql-file sql/bigquery/001_create_raw_tables.sql \
            --project-id "${{ inputs.bigquery_project_id }}" \
            --dataset "${{ inputs.bigquery_dataset }}"
          elt-bigquery load-raw \
            --manifest "${{ steps.local.outputs.manifest_path }}" \
            --payload-file "${{ steps.local.outputs.local_path }}" \
            --project-id "${{ inputs.bigquery_project_id }}" \
            --dataset "${{ inputs.bigquery_dataset }}" \
            --source-uri "gs://${{ inputs.gcs_bucket }}/${{ steps.local.outputs.object_name }}"

      - name: Run BigQuery transforms
        if: inputs.run_transform == 'true' && inputs.gcs_bucket != '' && inputs.bigquery_project_id != '' && inputs.bigquery_dataset != ''
        run: |
          elt-bigquery run-all-sql \
            --project-id "${{ inputs.bigquery_project_id }}" \
            --dataset "${{ inputs.bigquery_dataset }}"

      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-elt-${{ inputs.dataset_kind }}-${{ github.run_id }}
          path: work/raw-output
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## Raw ELT ingest"
            echo "- dataset_kind: \`${{ inputs.dataset_kind }}\`"
            echo "- source_run_id: \`${{ inputs.source_run_id }}\`"
            echo "- local raw object: \`${{ steps.local.outputs.local_path }}\`"
            echo "- manifest: \`${{ steps.local.outputs.manifest_path }}\`"
            if [ -n "${{ inputs.gcs_bucket }}" ]; then
              echo "- GCS raw object: \`gs://${{ inputs.gcs_bucket }}/${{ steps.local.outputs.object_name }}\`"
            fi
            if [ -n "${{ inputs.bigquery_project_id }}" ] && [ -n "${{ inputs.bigquery_dataset }}" ]; then
              echo "- BigQuery raw table target: \`${{ inputs.bigquery_project_id }}.${{ inputs.bigquery_dataset }}\`"
              echo "- BigQuery transform: \`${{ inputs.run_transform }}\`"
            fi
            echo "- artifact: \`raw-elt-${{ inputs.dataset_kind }}-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
