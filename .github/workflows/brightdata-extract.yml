name: BrightData extract

on:
  workflow_dispatch:
    inputs:
      workflow_type:
        description: v2 workflow type
        required: true
        type: choice
        options:
          - reviews
          - reviews_sequential
          - reviews_recent_relevance
          - facility
      csv_file:
        description: CSV path inside private data repo
        required: true
        default: results/dental_new.csv
      dataset_id:
        description: BrightData Dataset ID
        required: true
        default: gd_luzfs1dn2oa0teb81
      days_back:
        description: Review days back
        required: false
        default: "10"
      skip_column:
        description: Skip rows when this column is empty
        required: false
        default: web
      query:
        description: Facility search query
        required: false
        default: ""
      start_row:
        description: 1-based start row
        required: false
        default: "1"
      start_from_batch:
        description: 1-based batch number; overrides start_row when set
        required: false
        default: ""
      rows_per_batch:
        description: Rows per batch; used with start_from_batch
        required: false
        default: ""
      max_batches:
        description: Max batch count; 0 or empty means one batch for IssueOps safety
        required: false
        default: ""
      row_limit:
        description: Max rows to extract; empty means all
        required: false
        default: ""
      max_wait_minutes:
        description: BrightData snapshot max wait minutes
        required: false
        default: "90"
      run_transform:
        description: Run managed BigQuery transform SQL after raw load
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      workflow_type:
        required: true
        type: string
      csv_file:
        required: true
        type: string
      dataset_id:
        required: true
        type: string
      days_back:
        required: false
        type: string
        default: "10"
      skip_column:
        required: false
        type: string
        default: web
      query:
        required: false
        type: string
        default: ""
      start_row:
        required: false
        type: string
        default: "1"
      start_from_batch:
        required: false
        type: string
        default: ""
      rows_per_batch:
        required: false
        type: string
        default: ""
      max_batches:
        required: false
        type: string
        default: ""
      row_limit:
        required: false
        type: string
        default: ""
      max_wait_minutes:
        required: false
        type: string
        default: "90"
      run_transform:
        required: false
        type: string
        default: "true"
    secrets:
      BRIGHTDATA_API_TOKEN:
        required: true
      PRIVATE_REPO_PAT:
        required: true
      GCP_SERVICE_ACCOUNT_JSON:
        required: false
    outputs:
      dataset_kind:
        description: Raw dataset kind loaded by this run
        value: ${{ jobs.extract.outputs.dataset_kind }}
      gcs_uri:
        description: GCS URI for the raw payload when uploaded
        value: ${{ jobs.extract.outputs.gcs_uri }}
      manifest_uri:
        description: GCS URI for the raw manifest when uploaded
        value: ${{ jobs.extract.outputs.manifest_uri }}

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    outputs:
      dataset_kind: ${{ steps.kind.outputs.dataset_kind }}
      gcs_uri: ${{ steps.local.outputs.gcs_uri }}
      manifest_uri: ${{ steps.local.outputs.manifest_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private data
        uses: actions/checkout@v4
        with:
          repository: mememori8888/googlemap
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-data
          sparse-checkout: |
            settings
            results

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[gcp]"

      - name: Authenticate to Google Cloud
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Validate private CSV path
        env:
          CSV_FILE: ${{ inputs.csv_file }}
        run: |
          python - <<'PY'
          import os
          from pathlib import PurePosixPath

          csv_file = os.environ["CSV_FILE"].replace("\\", "/").strip()
          path = PurePosixPath(csv_file)
          if (
              csv_file.startswith("/")
              or path.is_absolute()
              or not path.parts
              or path.parts[0] not in {"settings", "results"}
              or any(part in {"", ".", ".."} for part in path.parts)
              or path.suffix.lower() != ".csv"
          ):
              raise SystemExit("csv_file must be a safe .csv path under settings/ or results/")
          PY

      - name: Detect dataset kind
        id: kind
        run: |
          if [ "${{ inputs.workflow_type }}" = "facility" ]; then
            echo "dataset_kind=facilities" >> "$GITHUB_OUTPUT"
          else
            echo "dataset_kind=reviews" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve input range
        id: range
        env:
          WORKFLOW_TYPE: ${{ inputs.workflow_type }}
          SKIP_COLUMN_INPUT: ${{ inputs.skip_column }}
          START_ROW_INPUT: ${{ inputs.start_row }}
          ROW_LIMIT_INPUT: ${{ inputs.row_limit }}
          START_FROM_BATCH_INPUT: ${{ inputs.start_from_batch }}
          ROWS_PER_BATCH_INPUT: ${{ inputs.rows_per_batch }}
          MAX_BATCHES_INPUT: ${{ inputs.max_batches }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          def positive_int(name: str, *, required: bool = False) -> int | None:
              value = os.environ[name].strip()
              if not value:
                  if required:
                      raise SystemExit(f"{name} is required")
                  return None
              try:
                  parsed = int(value)
              except ValueError as exc:
                  raise SystemExit(f"{name} must be an integer") from exc
              if parsed < 1:
                  raise SystemExit(f"{name} must be greater than 0")
              return parsed

          workflow_type = os.environ["WORKFLOW_TYPE"]
          skip_column = os.environ["SKIP_COLUMN_INPUT"]
          if workflow_type in {"facility", "reviews"}:
              skip_column = ""

          start_row = positive_int("START_ROW_INPUT", required=True)
          row_limit = positive_int("ROW_LIMIT_INPUT")
          start_from_batch = positive_int("START_FROM_BATCH_INPUT")
          rows_per_batch = positive_int("ROWS_PER_BATCH_INPUT")
          max_batches = positive_int("MAX_BATCHES_INPUT")

          if start_from_batch is not None:
              if rows_per_batch is None:
                  raise SystemExit("ROWS_PER_BATCH_INPUT is required when START_FROM_BATCH_INPUT is set")
              start_row = (start_from_batch - 1) * rows_per_batch + 1
              if max_batches is not None:
                  row_limit = rows_per_batch * max_batches
              elif row_limit is None:
                  row_limit = rows_per_batch

          print(f"skip_column={skip_column}")
          print(f"start_row={start_row}")
          print(f"row_limit={row_limit or ''}")
          PY

      - name: Validate BrightData input CSV
        run: |
          args=(
            --csv-file "private-data/${{ inputs.csv_file }}"
            --workflow-type "${{ inputs.workflow_type }}"
            --days-back "${{ inputs.days_back }}"
            --skip-column "${{ steps.range.outputs.skip_column }}"
            --start-row "${{ steps.range.outputs.start_row }}"
            --query "${{ inputs.query }}"
            --output work/input-validation.json
          )
          if [ -n "${{ steps.range.outputs.row_limit }}" ]; then
            args+=(--row-limit "${{ steps.range.outputs.row_limit }}")
          fi
          elt-brightdata validate-input "${args[@]}"

      - name: Build BrightData input items
        run: |
          args=(
            --csv-file "private-data/${{ inputs.csv_file }}"
            --workflow-type "${{ inputs.workflow_type }}"
            --output work/items.json
            --days-back "${{ inputs.days_back }}"
            --skip-column "${{ steps.range.outputs.skip_column }}"
            --start-row "${{ steps.range.outputs.start_row }}"
            --query "${{ inputs.query }}"
          )
          if [ -n "${{ steps.range.outputs.row_limit }}" ]; then
            args+=(--row-limit "${{ steps.range.outputs.row_limit }}")
          fi
          elt-brightdata build-items "${args[@]}"

      - name: Run BrightData Dataset API
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
        run: |
          elt-brightdata run-dataset \
            --dataset-id "${{ inputs.dataset_id }}" \
            --items-file work/items.json \
            --output work/brightdata-result.json \
            --max-wait-minutes "${{ inputs.max_wait_minutes }}"

      - name: Store raw object locally and optionally upload to GCS
        id: local
        run: |
          args=(
            --input work/brightdata-result.json
            --source-run-id "brightdata-${{ github.run_id }}"
            --dataset-kind "${{ steps.kind.outputs.dataset_kind }}"
            --local-output-root work/raw-output
          )
          if [ -n "${{ vars.ELT_RAW_GCS_BUCKET }}" ]; then
            args+=(--gcs-bucket "${{ vars.ELT_RAW_GCS_BUCKET }}")
          fi
          elt-raw-write "${args[@]}" | tee work/raw-write-result.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          result = json.loads(Path("work/raw-write-result.json").read_text(encoding="utf-8"))
          manifest = result["manifest"]
          local_path = result["local_path"]
          print(f"object_name={manifest['object_name']}")
          print(f"manifest_path={local_path}.manifest.json")
          print(f"local_path={local_path}")
          if result.get("gcs_uri"):
              print(f"gcs_uri={result['gcs_uri']}")
              print(f"manifest_uri={result['gcs_uri']}.manifest.json")
          PY

      - name: Ensure BigQuery raw tables
        if: vars.ELT_RAW_GCS_BUCKET != '' && vars.ELT_BIGQUERY_PROJECT_ID != '' && vars.ELT_BIGQUERY_DATASET != ''
        run: |
          elt-bigquery run-sql \
            --sql-file sql/bigquery/001_create_raw_tables.sql \
            --project-id "${{ vars.ELT_BIGQUERY_PROJECT_ID }}" \
            --dataset "${{ vars.ELT_BIGQUERY_DATASET }}"

      - name: Load raw row into BigQuery
        if: vars.ELT_RAW_GCS_BUCKET != '' && vars.ELT_BIGQUERY_PROJECT_ID != '' && vars.ELT_BIGQUERY_DATASET != ''
        run: |
          elt-bigquery load-raw \
            --manifest "${{ steps.local.outputs.manifest_path }}" \
            --payload-file "${{ steps.local.outputs.local_path }}" \
            --project-id "${{ vars.ELT_BIGQUERY_PROJECT_ID }}" \
            --dataset "${{ vars.ELT_BIGQUERY_DATASET }}" \
            --source-uri "gs://${{ vars.ELT_RAW_GCS_BUCKET }}/${{ steps.local.outputs.object_name }}"

      - name: Run BigQuery transforms
        if: inputs.run_transform == 'true' && vars.ELT_RAW_GCS_BUCKET != '' && vars.ELT_BIGQUERY_PROJECT_ID != '' && vars.ELT_BIGQUERY_DATASET != ''
        run: |
          elt-bigquery run-all-sql \
            --project-id "${{ vars.ELT_BIGQUERY_PROJECT_ID }}" \
            --dataset "${{ vars.ELT_BIGQUERY_DATASET }}"

      - name: Upload extract artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightdata-extract-${{ github.run_id }}
          path: work/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## BrightData extract"
            echo "- workflow_type: \`${{ inputs.workflow_type }}\`"
            echo "- dataset_kind: \`${{ steps.kind.outputs.dataset_kind }}\`"
            echo "- csv_file: \`${{ inputs.csv_file }}\`"
            if [ -f work/input-validation.json ]; then
              echo "- input validation: \`work/input-validation.json\`"
            fi
            echo "- dataset_id: \`${{ inputs.dataset_id }}\`"
            echo "- max_wait_minutes: \`${{ inputs.max_wait_minutes }}\`"
            echo "- local raw object: \`${{ steps.local.outputs.local_path }}\`"
            echo "- manifest: \`${{ steps.local.outputs.manifest_path }}\`"
            if [ -n "${{ vars.ELT_RAW_GCS_BUCKET }}" ]; then
              echo "- GCS raw object: \`${{ steps.local.outputs.gcs_uri }}\`"
            fi
            if [ -n "${{ vars.ELT_BIGQUERY_PROJECT_ID }}" ] && [ -n "${{ vars.ELT_BIGQUERY_DATASET }}" ]; then
              echo "- BigQuery raw dataset: \`${{ vars.ELT_BIGQUERY_PROJECT_ID }}.${{ vars.ELT_BIGQUERY_DATASET }}\`"
              echo "- BigQuery raw schema: \`ensured\`"
              echo "- BigQuery transform: \`${{ inputs.run_transform }}\`"
            fi
            echo "- artifact: \`brightdata-extract-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
