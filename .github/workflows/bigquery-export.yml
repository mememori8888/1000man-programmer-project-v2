name: BigQuery CSV export

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: BigQuery project id
        required: true
      dataset:
        description: BigQuery dataset
        required: true
      table:
        description: BigQuery table to export
        required: true
        default: fact_reviews
        type: choice
        options:
          - fact_reviews
          - dim_facilities
          - fact_review_relevance_ranks
      destination_uri:
        description: GCS URI for CSV output, for example gs://bucket/exports/fact_reviews-*.csv
        required: false
        default: ""
      gcs_bucket:
        description: Optional GCS bucket used with legacy_output_path when destination_uri is empty
        required: false
        default: ""
      legacy_output_path:
        description: Optional legacy output path, for example results/dental_reviews.csv
        required: false
        default: ""
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      dataset:
        required: true
        type: string
      table:
        required: true
        type: string
      destination_uri:
        required: false
        type: string
        default: ""
      gcs_bucket:
        required: false
        type: string
        default: ""
      legacy_output_path:
        required: false
        type: string
        default: ""
    secrets:
      GCP_SERVICE_ACCOUNT_JSON:
        required: false
    outputs:
      table_id:
        description: Exported BigQuery table id
        value: ${{ jobs.export.outputs.table_id }}
      destination_uri:
        description: GCS CSV destination URI
        value: ${{ jobs.export.outputs.destination_uri }}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    outputs:
      table_id: ${{ steps.result.outputs.table_id }}
      destination_uri: ${{ steps.result.outputs.destination_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[gcp]"

      - name: Authenticate to Google Cloud
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Export table to CSV
        run: |
          mkdir -p work
          elt-bigquery export-csv \
            --project-id "${{ inputs.project_id }}" \
            --dataset "${{ inputs.dataset }}" \
            --table "${{ inputs.table }}" \
            --destination-uri "${{ inputs.destination_uri }}" \
            --gcs-bucket "${{ inputs.gcs_bucket }}" \
            --legacy-output-path "${{ inputs.legacy_output_path }}" \
            | tee work/export-result.json

      - name: Capture export result
        id: result
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          result = json.loads(Path("work/export-result.json").read_text(encoding="utf-8"))
          print(f"table_id={result['table_id']}")
          print(f"destination_uri={result['destination_uri']}")
          PY

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("work/export-result.json").read_text(encoding="utf-8"))
          print("## BigQuery CSV export")
          print(f"- table: `{result['table_id']}`")
          print(f"- destination_uri: `{result['destination_uri']}`")
          PY
