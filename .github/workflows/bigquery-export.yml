name: BigQuery CSV export

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: BigQuery project id
        required: true
      dataset:
        description: BigQuery dataset
        required: true
      table:
        description: BigQuery table to export
        required: true
        default: fact_reviews
        type: choice
        options:
          - fact_reviews
          - dim_facilities
          - fact_review_relevance_ranks
      destination_uri:
        description: GCS URI for CSV output, for example gs://bucket/exports/fact_reviews-*.csv
        required: false
        default: ""
      gcs_bucket:
        description: Optional GCS bucket used with legacy_output_path when destination_uri is empty
        required: false
        default: ""
      legacy_output_path:
        description: Optional legacy output path, for example results/dental_reviews.csv
        required: false
        default: ""
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      dataset:
        required: true
        type: string
      table:
        required: true
        type: string
      destination_uri:
        required: false
        type: string
        default: ""
      gcs_bucket:
        required: false
        type: string
        default: ""
      legacy_output_path:
        required: false
        type: string
        default: ""
    secrets:
      GCP_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[gcp]"

      - name: Authenticate to Google Cloud
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Resolve destination URI
        id: destination
        env:
          DESTINATION_URI: ${{ inputs.destination_uri }}
          GCS_BUCKET: ${{ inputs.gcs_bucket }}
          LEGACY_OUTPUT_PATH: ${{ inputs.legacy_output_path }}
          TABLE: ${{ inputs.table }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import PurePosixPath

          destination_uri = os.environ.get("DESTINATION_URI", "").strip()
          if not destination_uri:
              bucket = os.environ.get("GCS_BUCKET", "").strip()
              if not bucket:
                  raise SystemExit("destination_uri or gcs_bucket is required")
              legacy_output_path = os.environ.get("LEGACY_OUTPUT_PATH", "").strip() or f"{os.environ['TABLE']}.csv"
              normalized = legacy_output_path.replace("\\", "/").lstrip("/")
              parts = [part for part in normalized.split("/") if part not in {"", "."}]
              if not parts or any(part == ".." for part in parts):
                  raise SystemExit(f"legacy_output_path is not safe: {legacy_output_path}")
              path = PurePosixPath("exports", *parts)
              if path.suffix.lower() != ".csv":
                  path = path.with_suffix(".csv")
              if "*" not in path.name:
                  path = path.with_name(f"{path.stem}-*{path.suffix}")
              destination_uri = f"gs://{bucket}/{path.as_posix()}"
          print(f"destination_uri={destination_uri}")
          PY

      - name: Export table to CSV
        run: |
          elt-bigquery export-csv \
            --project-id "${{ inputs.project_id }}" \
            --dataset "${{ inputs.dataset }}" \
            --table "${{ inputs.table }}" \
            --destination-uri "${{ steps.destination.outputs.destination_uri }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## BigQuery CSV export"
            echo "- table: \`${{ inputs.project_id }}.${{ inputs.dataset }}.${{ inputs.table }}\`"
            echo "- destination_uri: \`${{ steps.destination.outputs.destination_uri }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
