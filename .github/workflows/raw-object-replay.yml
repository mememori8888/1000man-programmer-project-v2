name: Raw object replay

on:
  workflow_dispatch:
    inputs:
      raw_uri:
        description: GCS URI for the raw payload, for example gs://bucket/raw/reviews/.../file.json
        required: true
      manifest_uri:
        description: Optional GCS URI for manifest; defaults to raw_uri + .manifest.json
        required: false
        default: ""
      project_id:
        description: BigQuery project id
        required: true
      dataset:
        description: BigQuery dataset
        required: true
      run_transform:
        description: Run managed BigQuery transform SQL after replay
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[gcp]"

      - name: Authenticate to Google Cloud
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Ensure BigQuery raw tables
        run: |
          elt-bigquery run-sql \
            --sql-file sql/bigquery/001_create_raw_tables.sql \
            --project-id "${{ inputs.project_id }}" \
            --dataset "${{ inputs.dataset }}"

      - name: Replay raw object into BigQuery
        id: replay
        run: |
          mkdir -p work
          args=(
            replay-gcs-raw
            --raw-uri "${{ inputs.raw_uri }}"
            --project-id "${{ inputs.project_id }}"
            --dataset "${{ inputs.dataset }}"
          )
          if [ -n "${{ inputs.manifest_uri }}" ]; then
            args+=(--manifest-uri "${{ inputs.manifest_uri }}")
          fi
          elt-bigquery "${args[@]}" | tee work/replay-result.json

      - name: Run BigQuery transforms
        if: inputs.run_transform == 'true'
        run: |
          elt-bigquery run-all-sql \
            --project-id "${{ inputs.project_id }}" \
            --dataset "${{ inputs.dataset }}"

      - name: Upload replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-object-replay-${{ github.run_id }}
          path: work/replay-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        env:
          RAW_URI: ${{ inputs.raw_uri }}
          MANIFEST_URI: ${{ inputs.manifest_uri }}
          PROJECT_ID: ${{ inputs.project_id }}
          DATASET: ${{ inputs.dataset }}
          RUN_TRANSFORM: ${{ inputs.run_transform }}
          ARTIFACT_NAME: raw-object-replay-${{ github.run_id }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          result_path = Path("work/replay-result.json")
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {}
          print("## Raw object replay")
          print(f"- raw_uri: `{os.environ['RAW_URI']}`")
          manifest_uri = os.environ["MANIFEST_URI"]
          if manifest_uri:
              print(f"- manifest_uri: `{manifest_uri}`")
          elif result.get("manifest_uri"):
              print(f"- manifest_uri: `{result['manifest_uri']}`")
          print(f"- BigQuery dataset: `{os.environ['PROJECT_ID']}.{os.environ['DATASET']}`")
          if result.get("table_id"):
              print(f"- BigQuery raw table: `{result['table_id']}`")
          if result.get("job_id"):
              print(f"- BigQuery load job: `{result['job_id']}`")
          print("- BigQuery raw schema: `ensured`")
          print(f"- BigQuery transform: `{os.environ['RUN_TRANSFORM']}`")
          if result_path.exists():
              print(f"- artifact: `{os.environ['ARTIFACT_NAME']}`")
          PY
