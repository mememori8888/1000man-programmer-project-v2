name: Raw object replay

on:
  workflow_dispatch:
    inputs:
      raw_uri:
        description: GCS URI for the raw payload, for example gs://bucket/raw/reviews/.../file.json
        required: true
      manifest_uri:
        description: Optional GCS URI for manifest; defaults to raw_uri + .manifest.json
        required: false
        default: ""
      project_id:
        description: BigQuery project id
        required: true
      dataset:
        description: BigQuery dataset
        required: true
      run_transform:
        description: Run managed BigQuery transform SQL after replay
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[gcp]"

      - name: Authenticate to Google Cloud
        if: env.GCP_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Ensure BigQuery raw tables
        run: |
          elt-bigquery run-sql \
            --sql-file sql/bigquery/001_create_raw_tables.sql \
            --project-id "${{ inputs.project_id }}" \
            --dataset "${{ inputs.dataset }}"

      - name: Replay raw object into BigQuery
        id: replay
        run: |
          args=(
            replay-gcs-raw
            --raw-uri "${{ inputs.raw_uri }}"
            --project-id "${{ inputs.project_id }}"
            --dataset "${{ inputs.dataset }}"
          )
          if [ -n "${{ inputs.manifest_uri }}" ]; then
            args+=(--manifest-uri "${{ inputs.manifest_uri }}")
          fi
          elt-bigquery "${args[@]}" | tee work-replay-result.json

      - name: Run BigQuery transforms
        if: inputs.run_transform == 'true'
        run: |
          elt-bigquery run-all-sql \
            --project-id "${{ inputs.project_id }}" \
            --dataset "${{ inputs.dataset }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Raw object replay"
            echo "- raw_uri: \`${{ inputs.raw_uri }}\`"
            if [ -n "${{ inputs.manifest_uri }}" ]; then
              echo "- manifest_uri: \`${{ inputs.manifest_uri }}\`"
            fi
            echo "- BigQuery dataset: \`${{ inputs.project_id }}.${{ inputs.dataset }}\`"
            echo "- BigQuery raw schema: \`ensured\`"
            echo "- BigQuery transform: \`${{ inputs.run_transform }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
