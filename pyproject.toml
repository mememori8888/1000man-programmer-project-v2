[project]
name = "1000man-programmer-project-v2"
version = "0.1.0"
description = "GCS and BigQuery ELT foundation for scalable BrightData workflows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-bigquery>=3.25.0",
  "google-cloud-storage>=2.18.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
elt-bigquery = "elt_v2.bigquery_cli:main"
elt-brightdata = "elt_v2.brightdata_cli:main"
elt-raw-write = "elt_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elt_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
